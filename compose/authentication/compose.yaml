x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  proxy:
    name: proxy-network
    external: true
  ldap-net:
    name: ldap-network
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/16

services:
  pocket-id:
    image: ghcr.io/pocket-id/pocket-id:${POCKET_ID_IMAGE_TAG:-v2}
    restart: unless-stopped
    logging: *default-logging
    dns:
      - ${INTERNAL_DNS_IP}
      - 1.1.1.1
    environment:
      - ENCRYPTION_KEY=${POCKET_ID_ENCRYPTION_KEY:?Set POCKET_ID_ENCRYPTION_KEY in .env}
      - APP_URL=${APP_URL:?Set APP_URL in .env}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Add MAXMIND_LICENSE_KEY here to enable GeoIP lookups (optional).
    expose:
      - 1411
    volumes:
      - "/opt/pocketid/data:/app/data"
    # Optional healthcheck
    healthcheck:
      test: [ "CMD", "/app/pocket-id", "healthcheck" ]
      interval: 1m30s
      timeout: 5s
      retries: 2
      start_period: 10s
    networks:
      proxy:
        ipv4_address: 10.2.0.4
    labels:
      - traefik.docker.network=proxy-network
      - traefik.enable=true
      - traefik.http.routers.oidc.entrypoints=websecure
      - traefik.http.routers.oidc.rule=Host(`${POCKET_ID_HOST}`)
      - traefik.http.routers.oidc.tls=true
      - traefik.http.routers.oidc.tls.certresolver=letsencrypt
      - traefik.http.services.pocketid.loadbalancer.server.port=1411

  lldap:
    image: lldap/lldap:${LLDAP_IMAGE_TAG:-2026-09-22}
    restart: unless-stopped
    logging: *default-logging
    environment:
      - TZ=${TZ}
      - LLDAP_JWT_SECRET=${LLDAP_JWT_SECRET:?Set LLDAP_JWT_SECRET in .env}
      - LLDAP_KEY_SEED=${LLDAP_KEY_SEED:?Set LLDAP_KEY_SEED in .env}
      - LLDAP_LDAP_BASE_DN=${LLDAP_LDAP_BASE_DN:?Set LLDAP_LDAP_BASE_DN in .env}
      - LLDAP_LDAP_USER_PASS=${LLDAP_LDAP_USER_PASS:?Set LLDAP_LDAP_USER_PASS in .env}
    volumes:
      - "/opt/lldap/data:/data"
    healthcheck:
      test: [ "CMD", "/app/lldap", "healthcheck", "--config-file", "/data/lldap_config.toml" ]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    expose:
      - 17170 # Web UI
      - 3890 # For LDAP, not recommended to expose, see Usage section.
      - 6360 # For LDAPS (LDAP Over SSL), enable port if LLDAP_LDAPS_OPTIONS__ENABLED set true, look env below
    networks:
      proxy:
        ipv4_address: 10.2.0.6
      ldap-net:
    labels:
      - traefik.docker.network=proxy-network
      - traefik.enable=true

       # --- Web UI (HTTP/HTTPS) ---
      - traefik.http.routers.account.entrypoints=websecure
      - traefik.http.routers.account.rule=Host(`${LLDAP_HOST}`)
      - traefik.http.routers.account.tls=true
      - traefik.http.routers.account.tls.certresolver=letsencrypt
      - traefik.http.services.lldap.loadbalancer.server.port=17170

      # --- Raw LDAP protocol (TCP passthrough) ---
      - traefik.tcp.routers.account.rule=HostSNI(`*`)
      - traefik.tcp.routers.account.entrypoints=ldap
      - traefik.tcp.services.lldap.loadbalancer.server.port=3890
