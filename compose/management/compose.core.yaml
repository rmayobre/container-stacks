x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

################################
# 🦎 KOMODO COMPOSE - MONGO 🦎 #
################################

## This compose file will deploy:
##   1. MongoDB
##   2. Komodo Core (Web UI)
##   3. Komodo Periphery

networks:
  komodo-net:
    name: komodo-network
  proxy:
    name: proxy-network
    external: true

services:
  mongo:
    container_name: mongo-db
    image: mongo:${MONGO_IMAGE_TAG:-8.0}
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    logging: *default-logging
    networks:
      - komodo-net
    volumes:
      - ${MONGO_DB_DATA}:/data/db
      - ${MONGO_DB_CONFIG}:/data/configdb
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DB_USERNAME:?Set KOMODO_DB_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DB_PASSWORD:?Set KOMODO_DB_PASSWORD in .env}

  core:
    container_name: komodo-core
    image: ghcr.io/moghtech/komodo-core:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    labels:
      - traefik.docker.network=proxy-network
      - traefik.enable=true
      - traefik.http.routers.komodo.entrypoints=websecure
      - traefik.http.routers.komodo.rule=Host(`${KOMODO_HOSTNAME}`)
      - traefik.http.routers.komodo.tls=true
      - traefik.http.routers.komodo.tls.certresolver=letsencrypt
      - traefik.http.services.komodo.loadbalancer.server.port=9120
      - komodo.skip=true # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    logging: *default-logging
    dns:
      - ${INTERNAL_DNS_IP}
      - 1.1.1.1
    depends_on:
      - mongo
    # Reached through Traefik only. Publish the port instead if you need direct access:
    # ports:
    #   - 9120:9120
    expose:
      - 9120
    env_file: .env
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME:?Set KOMODO_DB_USERNAME in .env}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD:?Set KOMODO_DB_PASSWORD in .env}
    networks:
      komodo-net:
      proxy:
        ipv4_address: 10.2.0.5
    volumes:
      - /opt/komodo/keys:/config/keys
      ## Store dated backups of the database - https://komo.do/docs/setup/backup
      - ${COMPOSE_KOMODO_BACKUPS_PATH}:/backups
      ## Store sync files on server
      # - /path/to/syncs:/syncs
      ## Optionally mount a custom core.config.toml
      # - /path/to/core.config.toml:/config/config.toml
    ## Allows for systemd Periphery connection at
    ## "https://host.docker.internal:8120"
    # extra_hosts:
    #   - host.docker.internal:host-gateway

  ## Deploy Periphery container using this block,
  ## or deploy the Periphery binary with systemd using
  ## https://github.com/moghtech/komodo/tree/main/scripts
  periphery:
    container_name: komodo-periphery
    image: ghcr.io/moghtech/komodo-periphery:${COMPOSE_KOMODO_IMAGE_TAG:-2}
    init: true
    networks:
      - komodo-net
    dns:
      - ${INTERNAL_DNS_IP}
      - 1.1.1.1
    #expose:
    #  - 8120
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    logging: *default-logging
    environment:
      PERIPHERY_ROOT_DIRECTORY: ${PERIPHERY_ROOT_DIRECTORY:?Set PERIPHERY_ROOT_DIRECTORY in .env}
      PERIPHERY_PASSKEYS: ${KOMODO_PASSKEY:?Set KOMODO_PASSKEY in .env}
      PERIPHERY_DISABLE_TERMINALS: ${PERIPHERY_DISABLE_TERMINALS:-true}
      PERIPHERY_SSL_ENABLED: ${PERIPHERY_SSL_ENABLED:-true}
      PERIPHERY_INCLUDE_DISK_MOUNTS: ${PERIPHERY_INCLUDE_DISK_MOUNTS:-/etc/hostname}
      PERIPHERY_LOGGING_PRETTY: ${PERIPHERY_LOGGING_PRETTY:-true}
      PERIPHERY_PRETTY_STARTUP_CONFIG: ${PERIPHERY_PRETTY_STARTUP_CONFIG:-true}
    volumes:
      - /opt/komodo/keys:/config/keys
      ## Mount external docker socket - TODO use docker socket proxy
      - /var/run/docker.sock:/var/run/docker.sock
      ## Allow Periphery to see processes outside of container
      - /proc:/proc
      ## Specify the Periphery agent root directory.
      ## Must be the same inside and outside the container,
      ## or docker will get confused. See https://github.com/moghtech/komodo/discussions/180.
      ## Default: /etc/komodo.
      - ${PERIPHERY_ROOT_DIRECTORY}:${PERIPHERY_ROOT_DIRECTORY}
