x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  proxy:
    name: proxy-network
    ipam:
      driver: default
      config:
        - subnet: 10.2.0.0/24

  # Isolated network (no outside access) between Traefik and the Docker socket proxy.
  socket-net:
    internal: true

services:

  # Wireguard Dashboard - used to manage wireguard clients/servers configurations.
  wgdashboard:
    image: ghcr.io/wgdashboard/wgdashboard:${WGDASHBOARD_IMAGE_TAG:-v4.3.3}
    restart: unless-stopped
    logging: *default-logging
    container_name: wgdashboard
    ports:
      - 10086:10086/tcp
      - 51820:51820/udp
    volumes:
      - /opt/wgdashboard/aconf:/etc/amnezia/amneziawg
      - /opt/wgdashboard/conf:/etc/wireguard
      - /opt/wgdashboard/data:/data
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1

  # Read-only, filtered access to the Docker API for Traefik, so Traefik never mounts the raw socket.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:${SOCKET_PROXY_IMAGE_TAG:-v0.5.0}
    container_name: socket-proxy
    restart: unless-stopped
    logging: *default-logging
    environment:
      - CONTAINERS=1
      - NETWORKS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket-net

  # Reverse Proxy used to proxy secure traffic to internal services. Readily configured for Linode DNS challenges.
  traefik:
    image: traefik:${TRAEFIK_IMAGE_TAG:-v3}
    container_name: traefik
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - /opt/traefik/certs:/letsencrypt
      - /opt/traefik/logs:/var/log/
      - /opt/traefik/sconfig/config.yml:/config.yml:ro
      - /opt/traefik/endpoints:/dynamic
    depends_on:
      socket-proxy:
        condition: service_started
    networks:
      proxy:
        ipv4_address: 10.2.0.3
      socket-net:
    ports:
      - 80:80
      - 389:389
      - 443:443
    environment:
      - LINODE_TOKEN=${TRAEFIK_LINODE_TOKEN:?Set TRAEFIK_LINODE_TOKEN in .env}
    labels:
      - traefik.docker.network=proxy-network
      - traefik.enable=true
      - traefik.http.routers.traefik.entrypoints=websecure
      - traefik.http.routers.traefik.rule=Host(`${TRAEFIK_DASHBOARD_HOST}`)
      - traefik.http.routers.traefik.tls=true
      - traefik.http.routers.traefik.tls.certresolver=letsencrypt
      - traefik.http.routers.traefik.service=api@internal
    healthcheck:
      test: [ "CMD", "traefik", "healthcheck", "--ping" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      # Globals
      - --api.dashboard=true
      - --api.insecure=false
      # Lets Encrypt
      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=linode
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=9.9.9.9:53,1.1.1.1:53
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # Entrypoints Web/Websecure
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certResolver=letsencrypt
      - --entrypoints.websecure.http.tls.domains[0].main=${DOMAIN}
      - --entrypoints.websecure.http.tls.domains[0].sans=*.${DOMAIN}
      - --entrypoints.ldap.address=:389
      # Logging
      - --accesslog=true
      - --accesslog.format=common
      - --accesslog.filepath=/var/log/access.log
      - --log=true
      - --log.format=common
      - --log.level=ERROR
      - --log.filepath=/var/log/traefik.log
      # Health endpoint used by the container healthcheck
      - --ping=true
      # Docker Provider
      - --providers.docker=true
      - --providers.docker.endpoint=tcp://socket-proxy:2375
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy-network
      # File Provider
      - --providers.file=true
      - --providers.file.directory=/dynamic # Used for WGDashboard
      - --providers.file.watch=true

  # Internal DNS to resolve domains and manage certifications for HTTPS.
  # This particular DNS can be configured for Ad blocking.
  dns-server:
    container_name: dns-server
    hostname: ${DNS_SERVER_HOST}
    image: technitium/dns-server:${TECHNITIUM_IMAGE_TAG:-15.6.2}
    labels:
      - traefik.docker.network=proxy-network
      - traefik.enable=true
      - traefik.http.routers.dns.entrypoints=websecure
      - traefik.http.routers.dns.rule=Host(`${DNS_SERVER_HOST}`)
      - traefik.http.routers.dns.tls=true
      - traefik.http.routers.dns.tls.certresolver=letsencrypt
      - traefik.http.services.dns.loadbalancer.server.port=5380
    # For DHCP deployments, use "host" network mode and remove all the port mappings, including the ports array by commenting them
    # network_mode: "host"
    ports:
      # - "5380:5380/tcp" #DNS web console (HTTP)
      # - "53443:53443/tcp" #DNS web console (HTTPS)
      - "53:53/udp" #DNS service
      - "53:53/tcp" #DNS service
      # - "853:853/udp" #DNS-over-QUIC service
      # - "853:853/tcp" #DNS-over-TLS service
      # - "443:443/udp" #DNS-over-HTTPS service (HTTP/3)
      # - "443:443/tcp" #DNS-over-HTTPS service (HTTP/1.1, HTTP/2)
      # - "80:80/tcp" #DNS-over-HTTP service (use with reverse proxy or certbot certificate renewal)
      # - "8053:8053/tcp" #DNS-over-HTTP service (use with reverse proxy)
      # - "67:67/udp" #DHCP service
    environment:
      - DNS_SERVER_DOMAIN=${DNS_SERVER_HOST} #The primary domain name used by this DNS Server to identify itself.
      - DNS_SERVER_ADMIN_PASSWORD=${DNS_ADMIN_PASSWORD:?Set DNS_ADMIN_PASSWORD in .env} #DNS web console admin user password.
      # - DNS_SERVER_ADMIN_PASSWORD_FILE=password.txt #The path to a file that contains a plain text password for the DNS web console admin user.
      # - DNS_SERVER_PREFER_IPV6=false #DNS Server will use IPv6 for querying whenever possible with this option enabled.
      # - DNS_SERVER_WEB_SERVICE_LOCAL_ADDRESSES=172.17.0.1,127.0.0.1 #Comma separated list of network interface IP addresses that you want the web service to listen on for requests. The "172.17.0.1" address is the built-in Docker bridge. The "[::]" is the default value if not specified. Note! This must be used only with "host" network mode.
      # - DNS_SERVER_WEB_SERVICE_HTTP_PORT=5380 #The TCP port number for the DNS web console over HTTP protocol.
      # - DNS_SERVER_WEB_SERVICE_HTTPS_PORT=53443 #The TCP port number for the DNS web console over HTTPS protocol.
      # - DNS_SERVER_WEB_SERVICE_ENABLE_HTTPS=false #Enables HTTPS for the DNS web console.
      # - DNS_SERVER_WEB_SERVICE_USE_SELF_SIGNED_CERT=false #Enables self signed TLS certificate for the DNS web console.
      # - DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PATH=/etc/dns/tls/cert.pfx #The file path to the TLS certificate for the DNS web console.
      # - DNS_SERVER_WEB_SERVICE_TLS_CERTIFICATE_PASSWORD=password #The password for the TLS certificate for the DNS web console.
      # - DNS_SERVER_WEB_SERVICE_HTTP_TO_TLS_REDIRECT=false #Enables HTTP to HTTPS redirection for the DNS web console.
      # - DNS_SERVER_OPTIONAL_PROTOCOL_DNS_OVER_HTTP=false #Enables DNS server optional protocol DNS-over-HTTP on TCP port 8053 to be used with a TLS terminating reverse proxy like nginx.
      # - DNS_SERVER_RECURSION=AllowOnlyForPrivateNetworks #Recursion options: Allow, Deny, AllowOnlyForPrivateNetworks, UseSpecifiedNetworkACL.
      # - DNS_SERVER_RECURSION_NETWORK_ACL=192.168.10.0/24, !192.168.10.2 #Comma separated list of IP addresses or network addresses to allow access. Add ! character at the start to deny access, e.g. !192.168.10.0/24 will deny entire subnet. The ACL is processed in the same order its listed. If no networks match, the default policy is to deny all except loopback. Valid only for `UseSpecifiedNetworkACL` recursion option.
      # - DNS_SERVER_RECURSION_DENIED_NETWORKS=1.1.1.0/24 #Comma separated list of IP addresses or network addresses to deny recursion. Valid only for `UseSpecifiedNetworkACL` recursion option. This option is obsolete and DNS_SERVER_RECURSION_NETWORK_ACL should be used instead.
      # - DNS_SERVER_RECURSION_ALLOWED_NETWORKS=127.0.0.1, 192.168.1.0/24 #Comma separated list of IP addresses or network addresses to allow recursion. Valid only for `UseSpecifiedNetworkACL` recursion option.  This option is obsolete and DNS_SERVER_RECURSION_NETWORK_ACL should be used instead.
      # - DNS_SERVER_ENABLE_BLOCKING=false #Sets the DNS server to block domain names using Blocked Zone and Block List Zone.
      # - DNS_SERVER_ALLOW_TXT_BLOCKING_REPORT=false #Specifies if the DNS Server should respond with TXT records containing a blocked domain report for TXT type requests.
      # - DNS_SERVER_BLOCK_LIST_URLS= #A comma separated list of block list URLs.
      # - DNS_SERVER_FORWARDERS=9.9.9.9, 1.1.1.1 #Comma separated list of forwarder addresses.
      # - DNS_SERVER_FORWARDER_PROTOCOL=Tcp #Forwarder protocol options: Udp, Tcp, Tls, Https, HttpsJson.
      # - DNS_SERVER_LOG_USING_LOCAL_TIME=true #Enable this option to use local time instead of UTC for logging.
    volumes:
      - /opt/technitium/dns:/etc/dns
    restart: unless-stopped
    logging: *default-logging
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65535
    networks:
      proxy:
        ipv4_address: 10.2.0.2
