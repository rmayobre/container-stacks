################################
# 🦎 KOMODO COMPOSE - MONGO 🦎 #
################################

## This compose file will deploy:
##   1. MongoDB
##   2. Komodo Core (Web UI)
##   3. Komodo Periphery

networks:
  komodo-net:
    name: komodo-network
  proxy:
    name: proxy-network
    external: true

services:
  mongo:
    container_name: mongo-db
    image: mongo
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    command: --quiet --wiredTigerCacheSizeGB 0.25
    env_file: .env
    restart: unless-stopped
    networks:
      - komodo-net
    volumes:
      - ${MONGO_DB_DATA}:/data/db
      - ${MONGO_DB_CONFIG}:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DB_PASSWORD}

  core:
    container_name: komodo-core
    image: ghcr.io/moghtech/komodo-core:2
    init: true
    labels:
      - traefik.docker.network=proxy-network
      - traefik.enable=true
      - traefik.http.routers.komodo.entrypoints=websecure
      - traefik.http.routers.komodo.rule=Host(`${KOMODO_HOSTNAME}`)
      - traefik.http.routers.komodo.tls=true
      - traefik.http.routers.komodo.tls.certresolver=letsencrypt
      - traefik.http.services.komodo.loadbalancer.server.port=9120
      - komodo.skip=true # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    dns:
      - ${INTERNAL_DNS_IP}
      - 1.1.1.1
    depends_on:
      - mongo
    ports:
      - 9120:9120
    #expose:
    #  - 9120
    env_file: .env
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DB_PASSWORD}
    networks:
      komodo-net:
      proxy:
        ipv4_address: 10.2.0.5
    volumes:
      - /opt/komodo/keys:/config/keys
      ## Store dated backups of the database - https://komo.do/docs/setup/backup
      - ${COMPOSE_KOMODO_BACKUPS_PATH}:/backups
      ## Store sync files on server
      # - /path/to/syncs:/syncs
      ## Optionally mount a custom core.config.toml
      # - /path/to/core.config.toml:/config/config.toml
    ## Allows for systemd Periphery connection at
    ## "https://host.docker.internal:8120"
    # extra_hosts:
    #   - host.docker.internal:host-gateway

  ## Deploy Periphery container using this block,
  ## or deploy the Periphery binary with systemd using
  ## https://github.com/moghtech/komodo/tree/main/scripts
  periphery:
    container_name: komodo-periphery
    image: ghcr.io/moghtech/komodo-periphery:2
    init: true
    networks:
      - komodo-net
    dns:
      - ${INTERNAL_DNS_IP}
      - 1.1.1.1
    #expose:
    #  - 8120
    labels:
      komodo.skip: # Prevent Komodo from stopping with StopAllContainers
    restart: unless-stopped
    env_file: .env
    volumes:
      - /opt/komodo/keys:/config/keys
      ## Mount external docker socket - TODO use docker socket proxy
      - /var/run/docker.sock:/var/run/docker.sock
      ## Allow Periphery to see processes outside of container
      - /proc:/proc
      ## Specify the Periphery agent root directory.
      ## Must be the same inside and outside the container,
      ## or docker will get confused. See https://github.com/moghtech/komodo/discussions/180.
      ## Default: /etc/komodo.
      - ${PERIPHERY_ROOT_DIRECTORY}:${PERIPHERY_ROOT_DIRECTORY}
